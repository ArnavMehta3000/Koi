[project]
name    = "Koi Sandbox"
version = "0.1.0"
author  = "Arnav"

[window]
title  = "Koi - Sandbox"
mode   = "windowed"  # windowed | borderless | fullscreen; the editor is always windowed
width  = 1280
height = 720
vsync  = false

[logging]
file       = "Logs/Koi.log"  # relative to <project>/.koi (editor) or the exe (runtime); empty disables
level      = "Trace"         # default for categories not listed below; --LogLevel still wins
history    = 4096            # records kept for the editor Log panel; 0 disables
console    = false
debug_sink = true

# Engine and editor categories; `level` covers the game's own and anything not listed.
# Override per run with --log, e.g. --log RHI=Trace or --log all=Trace
[logging.categories]
Engine   = "Info"
Platform = "Info"
Input    = "Info"
IO       = "Info"
Assets   = "Debug"
ECS      = "Info"
Scene    = "Debug"
Render   = "Debug"
RHI      = "Info"
Shaders  = "Info"
Editor   = "Info"
AssetDB  = "Info"
Import   = "Debug"
Cook     = "Info"

[scenes]
startup = "Main"

[scenes.list]
Main = "project://Content/Scenes/Main.scene.toml"

[input]
stick_deadzone = 0.2
trigger_deadzone = 0.05

[input.actions.MoveX]
negative = [ "A", "Left" ]
positive = [ "D", "Right" ]
axes = [ "Gamepad.LeftX" ]

[input.actions.MoveZ]
negative = [ "S", "Down" ]
positive = [ "W", "Up" ]
axes = [ "Gamepad.LeftY" ]

[input.actions.Turn]
negative = [ "Q" ]
positive = [ "R" ]
axes = [ "Gamepad.RightX" ]

[input.actions.Quit]
buttons = [ "Escape", "Gamepad.Start" ]
