[project]
name    = "Surf"
version = "0.1.0"

[window]
title  = "Koi Surfing Game"
mode   = "fullscreen"
width  = 1280
height = 720
vsync  = false

[logging]
file       = "Logs/Surf.log"  # relative to <project>/.koi (editor) or the exe (runtime); empty disables
level      = "Trace"
history    = 4096
console    = false
debug_sink = true

# Engine and editor categories; `level` covers the game's own and anything not listed.
# Override per run with --log, e.g. --log RHI=Trace or --log all=Trace
[logging.categories]
Engine   = "Info"
Platform = "Info"
Input    = "Info"
IO       = "Info"
Assets   = "Debug"
ECS      = "Info"
Scene    = "Debug"
Render   = "Debug"
RHI      = "Info"
Shaders  = "Info"
Physics  = "Debug"
Editor   = "Info"
AssetDB  = "Info"
Import   = "Debug"
Cook     = "Info"

[scenes]
startup = "Main"

[scenes.list]
Main = "project://Content/Scenes/Main.scene.toml"

[input]
stick_deadzone   = 0.2
trigger_deadzone = 0.05

[input.actions.MoveLeft]
buttons = [ "Left", "A" ]

[input.actions.MoveRight]
positive = [ "Right", "D" ]
