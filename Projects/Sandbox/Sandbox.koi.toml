[project]
name    = "Koi Sandbox"
version = "0.1.0"
author  = "Arnav"

[window]
title  = "Koi - Sandbox"
mode   = "windowed"  # windowed | borderless | fullscreen; the editor is always windowed
width  = 1280
height = 720
vsync  = false

[logging]
file       = "Logs/Koi.log"  # relative to <project>/.koi (editor) or the exe (runtime); empty disables
level      = "Debug"         # the Log panel hides Debug until asked; --log overrides for one run
history    = 16384           # records kept for the editor Log panel; 0 disables
console    = false
debug_sink = true

# Exceptions to `level`, e.g. RHI = "Trace". Override per run with --log RHI=Trace or --log all=Trace
[logging.categories]
Render = "Trace"

[scenes]
startup = "Hierarchy"

[scenes.list]
Main        = "project://Content/Scenes/Main.scene.toml"
PostProcess = "project://Content/Scenes/PostProcess.scene.toml"
Hierarchy   = "project://Content/Scenes/Hierarchy.scene.toml"

[physics]
fixed_step = 0.0166667  # seconds per FixedUpdate step (60 Hz)

[input]
stick_deadzone = 0.2
trigger_deadzone = 0.05

[input.actions.MoveX]
negative = [ "A", "Left" ]
positive = [ "D", "Right" ]
axes = [ "Gamepad.LeftX" ]

[input.actions.MoveZ]
negative = [ "S", "Down" ]
positive = [ "W", "Up" ]
axes = [ "Gamepad.LeftY" ]

[input.actions.Turn]
negative = [ "Q" ]
positive = [ "R" ]
axes = [ "Gamepad.RightX" ]

[input.actions.Quit]
buttons = [ "Escape", "Gamepad.Start" ]

[input.actions.NextScene]
buttons = [ "P" ]
