[project]
name    = "{{Name}}"
version = "0.1.0"

[window]
title  = "{{Name}}"
mode   = "windowed"  # windowed | borderless | fullscreen; the editor is always windowed
width  = 1280
height = 720
vsync  = true

[logging]
file       = "Logs/{{Name}}.log"  # relative to <project>/.koi (editor) or the exe (runtime); empty disables
level      = "Debug"         # the Log panel hides Debug until asked; --log overrides for one run
history    = 16384           # records kept for the editor Log panel; 0 disables
console    = false
debug_sink = true

# Exceptions to `level`, e.g. RHI = "Trace". Override per run with --log RHI=Trace or --log all=Trace
[logging.categories]

[scenes]
startup = "Main"

[scenes.list]
Main = "project://Content/Scenes/Main.scene.toml"

[physics]
fixed_step = 0.0166667  # seconds per FixedUpdate step (60 Hz)

[input]
stick_deadzone   = 0.2
trigger_deadzone = 0.05

[input.actions.Quit]
buttons = [ "Escape", "Gamepad.Start" ]
