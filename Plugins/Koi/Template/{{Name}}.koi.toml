[project]
name    = "{{Name}}"
version = "0.1.0"

[window]
title  = "{{Name}}"
mode   = "windowed"  # windowed | borderless | fullscreen; the editor is always windowed
width  = 1280
height = 720
vsync  = true

[logging]
file       = "Logs/{{Name}}.log"  # relative to <project>/.koi (editor) or the exe (runtime); empty disables
level      = "Info"
history    = 4096
console    = false
debug_sink = true

# Engine and editor categories; `level` covers the game's own and anything not listed.
# Override per run with --log, e.g. --log RHI=Trace or --log all=Trace
[logging.categories]
Engine   = "Info"
Platform = "Info"
Input    = "Info"
IO       = "Info"
Assets   = "Debug"
ECS      = "Info"
Scene    = "Debug"
Render   = "Debug"
RHI      = "Info"
Shaders  = "Info"
Physics  = "Info"
Editor   = "Info"
AssetDB  = "Info"
Import   = "Debug"
Cook     = "Info"

[scenes]
startup = "Main"

[scenes.list]
Main = "project://Content/Scenes/Main.scene.toml"

[physics]
fixed_step = 0.0166667  # seconds per FixedUpdate step (60 Hz)

[input]
stick_deadzone   = 0.2
trigger_deadzone = 0.05

[input.actions.Quit]
buttons = [ "Escape", "Gamepad.Start" ]
