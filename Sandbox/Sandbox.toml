[project]
name    = "Koi Sandbox"
version = "0.1.0"
author  = "Arnav"

[window]
title  = "Koi - Sandbox"
width  = 1280
height = 720
vsync  = false

[logging]
file       = "Logs/Koi.log"  # empty disables the file sink
level      = "Trace"         # runtime floor; the compile-time --LogLevel still wins
history    = 4096            # records kept for the editor Log panel; 0 disables
console    = false
debug_sink = true

[rendering]
pipeline = "deferred"

[assets]
startup_scene = "Assets/Scenes/Main.toml"
